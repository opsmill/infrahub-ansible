---
ci_config: &ci_config
  - ".github/workflows/ci.yml"
  - ".github/file-filters.yml"

github_workflows: &github_workflows
  - ".github/workflows/*.yml"

doc_files: &doc_files
  - "docs-infrahub/**"
  - package.json
  - package-lock.json

ansible_plugins: &ansible_plugins
  - "plugins/**"

ansible_docs: &ansible_docs
  - "docs/**"

python_all: &python_all
  - "**/*.py"

yaml_all: &yaml_all
  - "**/*.{yml,yaml}"

ansible_all:
  - *ansible_plugins
  - *ansible_docs

markdown_all: &markdown_all
  - "**/*.{md,mdx}"

documentation_all:
  - *doc_files
  - *markdown_all
