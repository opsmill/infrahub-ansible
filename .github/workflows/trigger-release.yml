---
# yamllint disable rule:truthy
name: "Deploy Collection"

# Trigger the workflow however you prefer
on:
  release:
    types:
      - published

jobs:
  publish:
    uses: ./.github/workflows/workflow-publish.yml
    secrets: inherit
    with:
      publish: true
      version: ${{ github.ref_name }}
  integration-testcontainers:
    # Runs the testcontainers integration suite against the released Infrahub.
    # Independent of `publish` so a heavy/flaky integration run never blocks release.
    uses: ./.github/workflows/workflow-integration-testcontainers.yml
    secrets: inherit
