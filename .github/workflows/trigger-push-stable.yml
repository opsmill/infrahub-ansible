---
# yamllint disable rule:truthy
name: "Push on stable"

on:
  push:
    branches:
      - stable
    paths-ignore:
      - "docs/**"

jobs:
  check_commit:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.filter.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # Fetches the commit history for the last 2 commits
      - id: filter
        env:
          GH_TOKEN: ${{ secrets.GH_INFRAHUB_BOT_TOKEN }}
        run: |
          set -euo pipefail
          commit_author=$(git log -1 --pretty=format:'%an')
          commit_message=$(git log -1 --pretty=format:'%s')

          # Skip the bot's own commits so preparing a release cannot trigger
          # preparing another. The merge of a release pull request only says
          # `chore(release):` when that pull request was squashed or rebased —
          # a merge commit says `Merge pull request #...` and matches nothing
          # below. Ask the API which pull requests this commit belongs to
          # instead, which holds for all three merge strategies.
          RELEASE_PR=$(
            gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              --jq '[.[]
                     | select(.merged_at != null)
                     | select(.head.ref | startswith("release/"))
                     | .number] | first // empty'
          )

          # The subject checks stay as a cheap fallback: they cost nothing and
          # still recognise in-flight commits from the previous scheme.
          if [ -n "${RELEASE_PR}" ]; then
            echo "Release PR #${RELEASE_PR} merged here — not preparing another."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [[ "$commit_message" == chore\(release\):* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [[ "$commit_author" == "opsmill-bot" && \
                  "$commit_message" == "chore: update pyproject.toml & galaxy.yml" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  prepare_release:
    needs: check_commit
    if: needs.check_commit.outputs.skip == 'false'
    runs-on: ubuntu-22.04
    outputs:
      next_version: ${{ steps.version.outputs.next-version }}
    steps:
      - name: "Set up Python"
        uses: "actions/setup-python@v7"
        with:
          python-version: "3.12"

      - name: "Install uv"
        uses: "astral-sh/setup-uv@v7"
        with:
          version: "0.9.18"

      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_INFRAHUB_BOT_TOKEN }}
          fetch-depth: 0

      - name: Get Previous tag
        id: previoustag
        uses: "WyriHaximus/github-action-get-previous-tag@master"
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Calculate next version
        id: version
        uses: patrickjahns/version-drafter-action@v1.3.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update pyproject.toml and galaxy.yml versions
        run: |
          VERSION=${{ steps.version.outputs.next-version }}
          echo "Updating to version $VERSION"
          uv version $VERSION
          sed -i "s/^version:.*/version: $VERSION/" galaxy.yml

      - name: Update lock file
        run: uv lock

      - name: Assemble the changelog
        env:
          VERSION: ${{ steps.version.outputs.next-version }}
        run: |
          set -euo pipefail

          # A release must say what changed. Fail loudly rather than tag a
          # version whose notes are empty — the same rule the shared
          # changelog-towncrier composite enforces, with no opt-out.
          shopt -s nullglob
          KEPT=()
          for f in changelog/*.md; do
            [ "$f" = "changelog/towncrier.md.template" ] && continue
            KEPT+=("$f")
          done
          if [ ${#KEPT[@]} -eq 0 ]; then
            MSG="No news fragments in changelog/ — refusing to cut"
            MSG="${MSG} ${VERSION} with an empty changelog."
            MSG="${MSG} Add a fragment (housekeeping is fine) and re-run."
            echo "::error::${MSG}"
            exit 1
          fi

          uv run towncrier build --version "${VERSION}" --yes

      - name: Open the release pull request
        env:
          GH_TOKEN: ${{ secrets.GH_INFRAHUB_BOT_TOKEN }}
          VERSION: ${{ steps.version.outputs.next-version }}
        run: |
          set -euo pipefail
          export BRANCH="release/${VERSION}"

          git config user.name "opsmill-bot"
          git config user.email "github-bot@opsmill.com"
          git switch -c "${BRANCH}"

          git add pyproject.toml galaxy.yml uv.lock CHANGELOG.md changelog/
          git commit -m "chore(release): ${VERSION}"

          # Re-running on a later push to stable refreshes the same branch
          # rather than opening a second PR for the same version. Plain
          # --force rather than --force-with-lease: checkout does not fetch
          # this branch's remote ref, so a lease has nothing to compare
          # against. The branch is bot-owned and regenerated every run.
          git push --force origin "${BRANCH}"

          # A run that computes a different version opens a different branch,
          # so an earlier release PR can still be open. Merging that one after
          # this one would walk the version files back and let release-publish
          # tag a version older than the one already released — supersede it
          # rather than let the two race.
          STALE=$(
            gh pr list --state open --base stable --json number,headRefName \
              --jq '.[]
                    | select(.headRefName | startswith("release/"))
                    | select(.headRefName != env.BRANCH)
                    | .number'
          )
          for PR in ${STALE}; do
            echo "Closing release PR #${PR}, superseded by ${BRANCH}."
            gh pr close "${PR}" \
              --comment "Superseded by the release pull request for ${VERSION}."
          done

          # Only an *open* pull request counts as one already prepared:
          # `gh pr view <branch>` resolves closed and merged ones too, so a
          # release PR closed without merging would otherwise be mistaken for
          # the current one and leave the version stranded on the branch with
          # nothing to merge.
          OPEN_PR=$(
            gh pr list --head "${BRANCH}" --state open --json number \
              --jq '.[0].number // empty'
          )
          if [ -n "${OPEN_PR}" ]; then
            echo "Release PR #${OPEN_PR} for ${BRANCH} already open — updated in place."
            exit 0
          fi

          gh pr create \
            --base stable \
            --head "${BRANCH}" \
            --title "chore(release): ${VERSION}" \
            --label "ci/skip-changelog" \
            --body "$(cat <<EOF
          Prepared automatically. Merging this pull request authorises the release:
          \`release-publish.yml\` then tags \`${VERSION}\` and publishes the GitHub
          Release using the assembled changelog as its body. Publishing the Release
          is what triggers the Galaxy upload.

          - Version bumped to \`${VERSION}\` in \`pyproject.toml\` and \`galaxy.yml\`
          - \`CHANGELOG.md\` assembled from the news fragments, which are consumed by this commit

          Review the assembled changelog before merging — it is what users will read.
          EOF
          )"

  docs:
    needs: ["prepare_release"]
    uses: ./.github/workflows/workflow-changelog-and-docs.yml
    secrets: inherit

# The release is no longer drafted here. prepare_release opens a release
# pull request; merging it lands the version on `stable`, and
# release-publish.yml then creates the tag and publishes the GitHub Release
# with the assembled changelog as its body.
