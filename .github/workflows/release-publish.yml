---
# yamllint disable rule:truthy
name: Publish release

# Fires when a release pull request lands on `stable`: creates the tag and
# publishes the GitHub Release whose body is the changelog section humans
# wrote, rather than a generated list of pull-request titles.
#
# Publishing the Release is what triggers release.yml, which validates the
# versions against the tag and ships the artifacts.
on:
  push:
    branches: [stable]

concurrency:
  group: release-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Tag and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Decide whether this push is a release
        id: decide
        run: |
          set -euo pipefail
          VERSION=$(sed -n "s/^version: \\(.*\\)/\\1/p" galaxy.yml)

          # Keyed on "is there a tag for the version on disk?" rather than on
          # the commit message, so it behaves the same whether the release PR
          # was squashed, rebased or merged.
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "${VERSION} is already tagged — nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "${VERSION} has no tag yet — publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract the changelog section
        if: steps.decide.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail

          # Everything from the first release heading after the towncrier
          # marker up to (but excluding) the next one — i.e. the section this
          # release just added.
          awk '
            /<!-- towncrier release notes start -->/ { seen = 1; next }
            seen && /^## / { if (started) exit; started = 1 }
            started { print }
          ' CHANGELOG.md > /tmp/release-body.md

          if [ ! -s /tmp/release-body.md ]; then
            echo "::error::Could not extract a changelog section for v${VERSION} from CHANGELOG.md."
            exit 1
          fi

          if ! grep -q "${VERSION}" /tmp/release-body.md; then
            MSG="The newest changelog section does not mention ${VERSION};"
            MSG="${MSG} refusing to publish mismatched notes."
            echo "::error::${MSG}"
            exit 1
          fi

          echo "Release body:"
          cat /tmp/release-body.md

      - name: Create the tag and the GitHub Release
        if: steps.decide.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_INFRAHUB_BOT_TOKEN }}
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "${VERSION}" \
            --notes-file /tmp/release-body.md
