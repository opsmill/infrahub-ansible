---
# yamllint disable rule:truthy
name: "Run Sanity, Unit & Integration Tests"
on:
  workflow_call:
    inputs:
      runs-on:
        description: "The OS to run the job on"
        required: false
        default: "ubuntu-22.04"
        type: string

  workflow_dispatch:
    inputs:
      runs-on:
        description: "The OS to run the job on"
        required: false
        default: "ubuntu-22.04"
        type: string

  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-ansible
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-import:
    uses: ansible/ansible-content-actions/.github/workflows/build_import.yaml@v1.1.0
  ansible-lint:
    uses: ansible/ansible-content-actions/.github/workflows/ansible_lint.yaml@v1.1.0
  sanity:
    uses: ansible/ansible-content-actions/.github/workflows/sanity.yaml@v1.1.0

  # Unit tests: fast, mock-based (pytest-httpx); no external services.
  unit-tests:
    name: "Unit tests (pytest)"
    runs-on: ${{ inputs.runs-on || 'ubuntu-22.04' }}
    timeout-minutes: 15
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"
      - name: "Set up Python"
        uses: "actions/setup-python@v6"
        with:
          python-version: "3.12"
      - name: "Install uv"
        uses: "astral-sh/setup-uv@v7"
        with:
          version: "0.9.18"
      - name: "Install dev dependencies"
        run: "uv sync --group dev"
      - name: "Run unit tests"
        run: "uv run pytest tests/unit -v"

  # Integration tests: spin up a real Infrahub via testcontainers. Runs after
  # sanity so we don't pay for the heavy stack when basic checks already fail.
  integration-testcontainers:
    needs: sanity
    uses: ./.github/workflows/workflow-integration-testcontainers.yml
    secrets: inherit

  all_green:
    if: ${{ always() }}
    needs:
      - sanity
      - ansible-lint
      - unit-tests
      - integration-testcontainers
    runs-on: ubuntu-22.04
    steps:
      - run: >-
          python -c "assert 'failure' not in
          set([
          '${{ needs.sanity.result }}',
          '${{ needs.ansible-lint.result }}',
          '${{ needs.unit-tests.result }}',
          '${{ needs.integration-testcontainers.result }}'
          ])"
