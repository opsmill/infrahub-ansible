---
# yamllint disable rule:truthy
name: "Run Sanity, Unit & Integration Tests"
on:
  workflow_call:
    inputs:
      runs-on:
        description: "The OS to run the job on"
        required: false
        default: "ubuntu-22.04"
        type: string

  workflow_dispatch:
    inputs:
      runs-on:
        description: "The OS to run the job on"
        required: false
        default: "ubuntu-22.04"
        type: string

  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-ansible
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-import:
    uses: ansible/ansible-content-actions/.github/workflows/build_import.yaml@v1.1.0
  ansible-lint:
    uses: ansible/ansible-content-actions/.github/workflows/ansible_lint.yaml@v1.1.0
  sanity:
    uses: ansible/ansible-content-actions/.github/workflows/sanity.yaml@v1.1.0

  # Unit tests: fast, mock-based (pytest-httpx); no external services.
  unit-tests:
    name: "Unit tests (pytest)"
    runs-on: ${{ inputs.runs-on || 'ubuntu-22.04' }}
    timeout-minutes: 15
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"
      - name: "Set up Python"
        uses: "actions/setup-python@v7"
        with:
          python-version: "3.12"
      - name: "Install uv"
        uses: "astral-sh/setup-uv@v7"
        with:
          version: "0.9.18"
      - name: "Install dev dependencies"
        run: "uv sync --group dev"
      - name: "Run unit tests"
        run: "uv run pytest tests/unit -v"

  # Integration tests: spin up a real Infrahub via testcontainers. The full stack
  # (neo4j, rabbitmq, prefect, ...) is too flaky on standard GitHub-hosted runners
  # to gate every pull request — observed both schema-load convergence timeouts and a
  # rabbitmq .erlang.cookie permission failure — so this runs on the nightly
  # schedule, on manual dispatch, and on the pull requests that update-infrahub.yml
  # opens to move Infrahub (head branch update-infrahub-<v>). Those pull requests
  # change nothing but the Infrahub version, so the integration tests are their only
  # test; a failure fails all_green, and auto-merge-testcontainers.yml merges only
  # when this job passed. infrahub-sdk bumps (update-infrahub-sdk-<s>, or a branch
  # containing -sdk-) and other pull requests do not run it, and are gated by
  # sanity, ansible-lint and the unit-tests job above.
  # Inside workflow_call, github.event_name and github.head_ref are the caller's.
  integration-testcontainers:
    needs: sanity
    if: >-
      ${{
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'pull_request' &&
          startsWith(github.head_ref, 'update-infrahub-') &&
          !startsWith(github.head_ref, 'update-infrahub-sdk-') &&
          !contains(github.head_ref, '-sdk-')
        )
      }}
    uses: ./.github/workflows/workflow-integration-testcontainers.yml
    secrets: inherit

  all_green:
    if: ${{ always() }}
    needs:
      - sanity
      - ansible-lint
      - unit-tests
      - integration-testcontainers
    runs-on: ubuntu-22.04
    steps:
      - run: >-
          python -c "assert 'failure' not in
          set([
          '${{ needs.sanity.result }}',
          '${{ needs.ansible-lint.result }}',
          '${{ needs.unit-tests.result }}',
          '${{ needs.integration-testcontainers.result }}'
          ])"
