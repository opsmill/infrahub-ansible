---
# yamllint disable rule:truthy
name: Release bump label

on:
  pull_request:
    branches:
      - stable
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions: {}

# Applying several labels at once fires one event per label within the same
# second, and each run sees only the labels present when its event fired. Let
# the newest run supersede the others so a transient "found: none" from an
# earlier event does not linger as a failed check.
concurrency:
  group: release-label-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Require one release bump label
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"

      - name: "Set up Python"
        uses: "actions/setup-python@v7"
        with:
          python-version: "3.12"

      - name: Validate release bump label
        env:
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPOSITORY: ${{ github.repository }}
        run: >-
          python scripts/check_release_labels.py
          --author-login "${PR_AUTHOR_LOGIN}"
          --head-repository "${PR_HEAD_REPOSITORY}"
          --labels-json "${PR_LABELS_JSON}"
          --head-ref "${PR_HEAD_REF}"
          --repository "${REPOSITORY}"
          --title "${PR_TITLE}"
