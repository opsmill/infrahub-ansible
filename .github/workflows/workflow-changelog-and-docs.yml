---
# yamllint disable rule:truthy
name: "Update Documentation"

on:
  workflow_call:
  workflow_dispatch:
jobs:
  generate_docs:
    runs-on: "ubuntu-22.04"
    name: "Create Docs"
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_INFRAHUB_BOT_TOKEN }}
          fetch-depth: 0

      - name: "Set up Python"
        uses: "actions/setup-python@v6"
        with:
          python-version: "3.12"

      - name: "Install uv"
        uses: "astral-sh/setup-uv@v7"
        with:
          version: "0.9.18"

      - name: Install dependencies
        run: "uv sync --group dev"

      - name: "Generate Docs"
        run: "uv run invoke generate-doc"

      - name: "Install pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: "Setup Node.js"
        uses: actions/setup-node@v6
        with:
          node-version: 22  # pnpm 11 requires Node >= 22.13
          cache: "pnpm"
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: "Install Node dependencies"
        run: pnpm install --frozen-lockfile
        working-directory: ./docs

      - name: "Build documentation"
        run: "uv run invoke docusaurus"

      - name: commit docs
        uses: github-actions-x/commit@v2.9
        with:
          github-token: ${{ secrets.GH_INFRAHUB_BOT_TOKEN }}
          push-branch: "stable"
          commit-message: "chore: update docs"
          files: docs/
          name: opsmill-bot
          email: github-bot@opsmill.com
          rebase: true
