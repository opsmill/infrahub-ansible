---
extends: default

ignore:
  - .venv
  - examples
  - tests/**
  - docs/node_modules/**
  - .specify/**  # vendored spec-kit tooling — own formatting, not collection YAML
  - .agents/**   # vendored agent skills/commands
  - docs/pnpm-lock.yaml

rules:
  braces:
    max-spaces-inside: 1
  comments-indentation: disable
  comments:
    # Changed this to stop a mess between linters from Prettier (vscode) to yamllint
    # See https://github.com/prettier/prettier/pull/10926 or https://github.com/redhat-developer/vscode-yaml/issues/433
    min-spaces-from-content: 1
  line-length:
    max: 120
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: false
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
  truthy:
    # Avoid false positives on GitHub Actions `on:` keys
    check-keys: false
