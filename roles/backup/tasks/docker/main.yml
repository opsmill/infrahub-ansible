---
# Docker Compose platform. Platform checks run first: no host change before they pass.
- name: Validate Docker platform inputs
  ansible.builtin.import_tasks: validate.yml

- name: Install the infrahub-backup binary
  ansible.builtin.get_url:
    url: "{{ backup_infrahub_tool_url | default(backup_infrahub_default_tool_url) }}"
    checksum: "{{ backup_infrahub_tool_checksum | default(backup_infrahub_default_tool_checksum) }}"
    dest: "{{ backup_infrahub_bin_path }}"
    mode: "0755"
    owner: "{{ 'root' if backup_infrahub_become | bool else omit }}"
    group: "{{ 'root' if backup_infrahub_become | bool else omit }}"
  become: "{{ backup_infrahub_become }}"
  when: backup_infrahub_install_tool | bool

- name: Create the backup directory
  ansible.builtin.file:
    path: "{{ backup_infrahub_backup_directory }}"
    state: directory
    mode: "{{ backup_infrahub_backup_directory_mode }}"
    owner: "{{ backup_infrahub_service_user if backup_infrahub_become | bool else omit }}"
  become: "{{ backup_infrahub_become }}"

- name: Create the config directory
  ansible.builtin.file:
    path: "{{ backup_infrahub_config_directory }}"
    state: directory
    mode: "0700"
    owner: "{{ 'root' if backup_infrahub_become | bool else omit }}"
    group: "{{ 'root' if backup_infrahub_become | bool else omit }}"
  become: "{{ backup_infrahub_become }}"

# Holds S3 credentials and backup_infrahub_environment: never log or diff it.
# No notify: the oneshot service reads it on every run.
- name: Configure the infrahub-backup environment file
  ansible.builtin.template:
    src: infrahub-backup.env.j2
    dest: "{{ backup_infrahub_env_file }}"
    mode: "0600"
    owner: "{{ 'root' if backup_infrahub_become | bool else omit }}"
    group: "{{ 'root' if backup_infrahub_become | bool else omit }}"
  become: "{{ backup_infrahub_become }}"
  no_log: true
  diff: false

- name: Setup systemd
  ansible.builtin.import_tasks: setup_systemd.yml
  when: backup_infrahub_setup_systemd | bool

# Disable path (FR-011): stop a timer left by a previous enablement. Unit files are
# left in place (harmless once disabled, research R4).
- name: Check for a previously installed Infrahub backup timer
  ansible.builtin.stat:
    path: "{{ backup_infrahub_systemd_directory }}/infrahub-backup.timer"
    get_checksum: false
  register: backup_infrahub_existing_timer
  when: not backup_infrahub_setup_systemd | bool

- name: Stop and disable the Infrahub backup timer
  ansible.builtin.systemd_service:
    name: infrahub-backup.timer
    state: stopped
    enabled: false
  become: "{{ backup_infrahub_become }}"
  when:
    - not backup_infrahub_setup_systemd | bool
    - backup_infrahub_existing_timer.stat.exists
    - backup_infrahub_systemd_manage_state | bool

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

# On-demand backup (FR-012). Credentials are fed as KEY=value lines on stdin and
# exported by a sh wrapper: `environment:` would put them on the remote command line
# (visible in `ps` and printed at -vvv even with no_log). `export "$line"` assigns
# the value literally (no re-expansion). no_log hides stdin in the result, which
# would also hide the tool's error: the result is registered and a separate task
# fails with the tool's output instead (US3-AS2).
- name: Run an Infrahub backup now
  vars:
    backup_infrahub_run_now_environment: >-
      {{
        ({'AWS_ACCESS_KEY_ID': backup_infrahub_s3_access_key_id}
         if backup_infrahub_s3_access_key_id is defined else {})
        | combine({'AWS_SECRET_ACCESS_KEY': backup_infrahub_s3_secret_access_key}
                  if backup_infrahub_s3_secret_access_key is defined else {})
        | combine(backup_infrahub_environment)
      }}
  ansible.builtin.command:
    argv: >-
      {{
        ['/bin/sh', '-c',
         'while IFS= read -r line || [ -n "$line" ]; do'
         ' [ -z "$line" ] || export "$line" || exit 97; done; exec "$@"',
         'infrahub-backup', backup_infrahub_bin_path]
        + backup_infrahub_create_args
      }}
    stdin: |-
      {% for key, value in backup_infrahub_run_now_environment | dictsort %}
      {{ key }}={{ value }}
      {% endfor %}
  become: "{{ backup_infrahub_become }}"
  # Same identity as the scheduled unit (User=), so both runs have the same access.
  become_user: "{{ backup_infrahub_service_user if backup_infrahub_become | bool else omit }}"
  no_log: "{{ backup_infrahub_has_secrets | bool }}"
  register: backup_infrahub_run_now_result
  changed_when: true
  failed_when: false
  when: backup_infrahub_run_now | bool

- name: Fail when the on-demand backup failed
  ansible.builtin.fail:
    msg: >-
      infrahub-backup failed (rc={{ backup_infrahub_run_now_result.rc | default('n/a') }}):
      {{ backup_infrahub_run_now_result.stderr | default('', true)
         or backup_infrahub_run_now_result.msg | default('', true)
         or backup_infrahub_run_now_result.stdout | default('', true) }}
  when:
    - backup_infrahub_run_now | bool
    - backup_infrahub_run_now_result is not skipped
    - backup_infrahub_run_now_result.rc | default(1) != 0
