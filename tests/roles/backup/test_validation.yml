---
# Failure contract (contracts/role-interface.md): every invalid input must fail
# the role with the documented message before any change on the host (SC-005).
# Run: ANSIBLE_ROLES_PATH=roles uv run ansible-playbook -i localhost, -c local tests/roles/backup/test_validation.yml
- name: Backup role input validation
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    test_prefix: /tmp/infrahub-backup-test-validation
    backup_infrahub_backup_directory: "{{ test_prefix }}/backups"
    backup_infrahub_config_directory: "{{ test_prefix }}/etc"
    backup_infrahub_systemd_directory: "{{ test_prefix }}/systemd"
    backup_infrahub_bin_path: "{{ test_prefix }}/bin/infrahub-backup"
    backup_infrahub_become: false
    backup_infrahub_install_tool: false
    backup_infrahub_systemd_manage_state: false
    role_should_have_failed: "Role unexpectedly succeeded"
    # run.sh runs this playbook at -vvv and fails if the sentinel shows up in the log.
    test_sentinel: SENTINEL-SECRET-e3b0c442

  tasks:
    - name: Ensure the test prefix is absent before running
      ansible.builtin.file:
        path: "{{ test_prefix }}"
        state: absent

    - name: Case retention_days < 1
      block:
        - name: Apply role with retention_days 0
          ansible.builtin.include_role:
            name: backup
          vars:
            backup_infrahub_retention_days: 0
        - name: Role must not succeed
          ansible.builtin.fail:
            msg: "{{ role_should_have_failed }}"
      rescue:
        - name: Assert retention_days message
          ansible.builtin.assert:
            that:
              - "'must be >= 1' in ansible_failed_result.msg"
              - "'retention_days' in ansible_failed_result.msg"
            fail_msg: "Unexpected failure: {{ ansible_failed_result.msg }}"

    - name: Case retention_count < 1
      block:
        - name: Apply role with retention_count -1
          ansible.builtin.include_role:
            name: backup
          vars:
            backup_infrahub_retention_count: -1
        - name: Role must not succeed
          ansible.builtin.fail:
            msg: "{{ role_should_have_failed }}"
      rescue:
        - name: Assert retention_count message
          ansible.builtin.assert:
            that:
              - "'must be >= 1' in ansible_failed_result.msg"
              - "'retention_count' in ansible_failed_result.msg"
            fail_msg: "Unexpected failure: {{ ansible_failed_result.msg }}"

    - name: Case unknown neo4j_metadata choice (argument spec)
      block:
        - name: Apply role with neo4j_metadata bogus
          ansible.builtin.include_role:
            name: backup
          vars:
            backup_infrahub_neo4j_metadata: bogus
        - name: Role must not succeed
          ansible.builtin.fail:
            msg: "{{ role_should_have_failed }}"
      rescue:
        - name: Assert argument-spec message
          ansible.builtin.assert:
            that:
              - "'neo4j_metadata' in ansible_failed_result.msg"
              - "role_should_have_failed not in ansible_failed_result.msg"
            fail_msg: "Unexpected failure: {{ ansible_failed_result.msg }}"

    - name: Case unsupported platform (argument spec)
      block:
        - name: Apply role with platform kubernetes
          ansible.builtin.include_role:
            name: backup
          vars:
            backup_infrahub_platform: kubernetes
        - name: Role must not succeed
          ansible.builtin.fail:
            msg: "{{ role_should_have_failed }}"
      rescue:
        - name: Assert argument-spec message
          ansible.builtin.assert:
            that:
              - "'backup_infrahub_platform' in ansible_failed_result.msg"
              - "'value of backup_infrahub_platform must be one of: docker' in ansible_failed_result.msg"
              - "role_should_have_failed not in ansible_failed_result.msg"
            fail_msg: "Unexpected failure: {{ ansible_failed_result.msg }}"

    - name: Case relative encrypt_key
      block:
        - name: Apply role with a relative encrypt_key
          ansible.builtin.include_role:
            name: backup
          vars:
            backup_infrahub_encrypt_key: backup.pub
        - name: Role must not succeed
          ansible.builtin.fail:
            msg: "{{ role_should_have_failed }}"
      rescue:
        - name: Assert encrypt_key message
          ansible.builtin.assert:
            that:
              - "'backup_infrahub_encrypt_key must be an absolute path' in ansible_failed_result.msg"
            fail_msg: "Unexpected failure: {{ ansible_failed_result.msg }}"

    - name: Case s3_upload without bucket
      block:
        - name: Apply role with s3_upload and no bucket
          ansible.builtin.include_role:
            name: backup
          vars:
            backup_infrahub_s3_upload: true
        - name: Role must not succeed
          ansible.builtin.fail:
            msg: "{{ role_should_have_failed }}"
      rescue:
        - name: Assert s3_bucket message
          ansible.builtin.assert:
            that:
              - "'backup_infrahub_s3_bucket is required' in ansible_failed_result.msg"
            fail_msg: "Unexpected failure: {{ ansible_failed_result.msg }}"

    - name: Case only one S3 credential set
      block:
        - name: Apply role with only the access key id
          ansible.builtin.include_role:
            name: backup
          vars:
            backup_infrahub_s3_access_key_id: AKIATEST
        - name: Role must not succeed
          ansible.builtin.fail:
            msg: "{{ role_should_have_failed }}"
      rescue:
        - name: Assert credentials message
          ansible.builtin.assert:
            that:
              - "'must be set together' in ansible_failed_result.msg"
            fail_msg: "Unexpected failure: {{ ansible_failed_result.msg }}"

    - name: Case invalid environment variable name
      block:
        - name: Apply role with environment key 1BAD
          ansible.builtin.include_role:
            name: backup
          vars:
            backup_infrahub_environment:
              1BAD: "{{ test_sentinel }}"
        - name: Role must not succeed
          ansible.builtin.fail:
            msg: "{{ role_should_have_failed }}"
      rescue:
        - name: Assert invalid-name message names the key, not the value
          ansible.builtin.assert:
            that:
              - "'invalid environment variable name' in ansible_failed_result.msg"
              - "'1BAD' in ansible_failed_result.msg"
              - test_sentinel not in ansible_failed_result.msg
            fail_msg: "Unexpected failure: {{ ansible_failed_result.msg }}"

    # Decision 11: only newline/CR is rejected; every other character round-trips.
    - name: Case environment value with a newline
      block:
        - name: Apply role with a multi-line environment value
          ansible.builtin.include_role:
            name: backup
          vars:
            backup_infrahub_environment:
              INFRAHUB_DB_PASSWORD: "{{ test_sentinel }}\nsecond-line"
        - name: Role must not succeed
          ansible.builtin.fail:
            msg: "{{ role_should_have_failed }}"
      rescue:
        - name: Assert newline message names the key, not the value
          ansible.builtin.assert:
            that:
              - "'contains a newline' in ansible_failed_result.msg"
              - "'backup_infrahub_environment.INFRAHUB_DB_PASSWORD' in ansible_failed_result.msg"
              - test_sentinel not in ansible_failed_result.msg
            fail_msg: "Unexpected failure: {{ ansible_failed_result.msg }}"

    - name: Case S3 secret with a carriage return
      block:
        - name: Apply role with a CR in the S3 secret
          ansible.builtin.include_role:
            name: backup
          vars:
            backup_infrahub_s3_access_key_id: AKIATEST
            backup_infrahub_s3_secret_access_key: "{{ test_sentinel }}\rx"
        - name: Role must not succeed
          ansible.builtin.fail:
            msg: "{{ role_should_have_failed }}"
      rescue:
        - name: Assert newline message names the variable, not the value
          ansible.builtin.assert:
            that:
              - "'contains a newline' in ansible_failed_result.msg"
              - "'backup_infrahub_s3_secret_access_key' in ansible_failed_result.msg"
              - "'backup_infrahub_s3_access_key_id' not in ansible_failed_result.msg"
              - test_sentinel not in ansible_failed_result.msg
            fail_msg: "Unexpected failure: {{ ansible_failed_result.msg }}"

    - name: Case tool_url without tool_checksum
      block:
        - name: Apply role with a custom tool URL and no checksum
          ansible.builtin.include_role:
            name: backup
          vars:
            backup_infrahub_install_tool: true
            backup_infrahub_tool_url: https://artifacts.example.com/infrahub-backup-linux-amd64
        - name: Role must not succeed
          ansible.builtin.fail:
            msg: "{{ role_should_have_failed }}"
      rescue:
        - name: Assert tool_checksum message
          ansible.builtin.assert:
            that:
              - "'backup_infrahub_tool_checksum is required when backup_infrahub_tool_url is set' in ansible_failed_result.msg"
            fail_msg: "Unexpected failure: {{ ansible_failed_result.msg }}"

    - name: Case unsupported architecture
      block:
        - name: Apply role with an empty architecture map
          ansible.builtin.include_role:
            name: backup
          vars:
            backup_infrahub_install_tool: true
            backup_infrahub_arch_map: {}
        - name: Role must not succeed
          ansible.builtin.fail:
            msg: "{{ role_should_have_failed }}"
      rescue:
        - name: Assert architecture message
          ansible.builtin.assert:
            that:
              - "'Unsupported architecture' in ansible_failed_result.msg"
            fail_msg: "Unexpected failure: {{ ansible_failed_result.msg }}"

    - name: Case relative config_directory
      block:
        - name: Apply role with a relative config_directory
          ansible.builtin.include_role:
            name: backup
          vars:
            backup_infrahub_config_directory: etc/infrahub-backup
        - name: Role must not succeed
          ansible.builtin.fail:
            msg: "{{ role_should_have_failed }}"
      rescue:
        - name: Assert config_directory message
          ansible.builtin.assert:
            that:
              - "'backup_infrahub_config_directory must be an absolute path' in ansible_failed_result.msg"
            fail_msg: "Unexpected failure: {{ ansible_failed_result.msg }}"

    # A null credential counts as unset, so a set id with a null secret is one-sided.
    - name: Case S3 secret null with access key id set
      block:
        - name: Apply role with a null secret access key
          ansible.builtin.include_role:
            name: backup
          vars:
            backup_infrahub_s3_access_key_id: AKIATEST
            backup_infrahub_s3_secret_access_key: null
        - name: Role must not succeed
          ansible.builtin.fail:
            msg: "{{ role_should_have_failed }}"
      rescue:
        - name: Assert credentials message
          ansible.builtin.assert:
            that:
              - "'must be set together' in ansible_failed_result.msg"
            fail_msg: "Unexpected failure: {{ ansible_failed_result.msg }}"

    # become: true is safe here: the check fails before any task that escalates.
    # Linux only: the getent binary does not exist on macOS controllers.
    - name: Case non-existent service_user (Linux only)
      when: lookup('ansible.builtin.pipe', 'uname -s') == 'Linux'
      block:
        - name: Apply role with an unknown service user
          ansible.builtin.include_role:
            name: backup
          vars:
            backup_infrahub_become: true
            backup_infrahub_service_user: infrahub-backup-no-such-user
        - name: Role must not succeed
          ansible.builtin.fail:
            msg: "{{ role_should_have_failed }}"
      rescue:
        - name: Assert service_user message
          ansible.builtin.assert:
            that:
              - "'backup_infrahub_service_user' in ansible_failed_result.msg"
              - "'does not exist' in ansible_failed_result.msg"
            fail_msg: "Unexpected failure: {{ ansible_failed_result.msg }}"

    - name: Stat the test prefix
      ansible.builtin.stat:
        path: "{{ test_prefix }}"
      register: test_prefix_stat

    - name: Assert no host change (SC-005)
      ansible.builtin.assert:
        that:
          - not test_prefix_stat.stat.exists
        fail_msg: "{{ test_prefix }} was created: validation did not run before changes"
