---
# Null S3 credentials count as unset: the env file gets no AWS_* line (never
# AWS_ACCESS_KEY_ID="None"). Run without secrets.yml: extra vars would override
# the nulls. Nothing here is secret, so the env file may be slurped.
# Run via tests/roles/backup/run.sh (passes -e test_root=<tmpdir>).
- name: Backup role render (null S3 credentials)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    render_root: "{{ test_root }}/nullcreds"
    backup_infrahub_backup_directory: "{{ render_root }}/backups"
    backup_infrahub_config_directory: "{{ render_root }}/etc"
    backup_infrahub_systemd_directory: "{{ render_root }}/systemd"
    backup_infrahub_bin_path: "{{ render_root }}/bin/infrahub-backup"
    backup_infrahub_become: false
    backup_infrahub_install_tool: false
    backup_infrahub_systemd_manage_state: false
    backup_infrahub_setup_systemd: false
    backup_infrahub_s3_access_key_id: null
    backup_infrahub_s3_secret_access_key: null

  pre_tasks:
    - name: Require test_root (never render under /)
      ansible.builtin.assert:
        that:
          - test_root is defined
          - test_root | length > 1
          - test_root is abs
        fail_msg: "Pass -e test_root=<absolute temp dir>"
        quiet: true

  roles:
    - role: backup

  post_tasks:
    - name: Read env file
      ansible.builtin.slurp:
        src: "{{ backup_infrahub_config_directory }}/infrahub-backup.env"
      register: env_raw

    - name: Assert no AWS_ line in the env file
      vars:
        env_content: "{{ env_raw.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'AWS_' not in env_content"
          - "'None' not in env_content"
          - not backup_infrahub_has_secrets | bool
        fail_msg: "Unexpected env file:\n{{ env_content }}"
        quiet: true

# With no configured secrets, a run-now failure retains the tool's diagnostic.
- name: Backup role run-now (failure surfaces tool output when no secrets are configured)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    render_root: "{{ test_root }}/runnow-fail-no-secrets"
    backup_infrahub_backup_directory: "{{ render_root }}/backups"
    backup_infrahub_config_directory: "{{ render_root }}/etc"
    backup_infrahub_systemd_directory: "{{ render_root }}/systemd"
    backup_infrahub_bin_path: "{{ render_root }}/bin/infrahub-backup"
    backup_infrahub_become: false
    backup_infrahub_install_tool: false
    backup_infrahub_systemd_manage_state: false
    backup_infrahub_setup_systemd: false
    backup_infrahub_run_now: true
    fake_error: "FAKE-ERROR tasks are running, use --force"

  tasks:
    - name: Require test_root (never write under /)
      ansible.builtin.assert:
        that:
          - test_root is defined
          - test_root | length > 1
          - test_root is abs
        fail_msg: "Pass -e test_root=<absolute temp dir>"
        quiet: true

    - name: Create the fake tool directory
      ansible.builtin.file:
        path: "{{ render_root }}/bin"
        state: directory
        mode: "0755"

    - name: Install a fake infrahub-backup that fails
      ansible.builtin.copy:
        dest: "{{ backup_infrahub_bin_path }}"
        mode: "0755"
        content: |
          #!/bin/sh
          echo '{{ fake_error }}' >&2
          exit 1

    - name: Apply the role and expect failure
      block:
        - name: Apply the backup role
          ansible.builtin.include_role:
            name: backup

        - name: Role did not fail
          ansible.builtin.set_fact:
            backup_test_run_now_failed: false
      rescue:
        - name: Assert the tool error surfaced in the failure message
          ansible.builtin.assert:
            that:
              - fake_error in ansible_failed_result.msg
              - "'rc=1' in ansible_failed_result.msg"
            fail_msg: "Unexpected failure: {{ ansible_failed_result.msg | default(ansible_failed_result) }}"
            quiet: true

        - name: Record expected failure
          ansible.builtin.set_fact:
            backup_test_run_now_failed: true

    - name: Assert the role failed
      ansible.builtin.assert:
        that:
          - backup_test_run_now_failed | default(false)
        fail_msg: "Role succeeded although the backup tool exited 1"
        quiet: true
