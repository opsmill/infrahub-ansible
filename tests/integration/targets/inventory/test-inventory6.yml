---
### infrahub_inventory.yml file in YAML format
### opsmill.infrahub.inventory plugin is able to do a lookup for ENV vars: INFRAHUB_API_TOKEN and INFRAHUB_ADDRESS

# This inventory will retrieve the InfraDevice matching *all* the filters.
# So it will retrieved the InfraDevice present on site 'jfk1' with the role 'edge'
# For all those InfraDevice, it will retrieved the differents Attribute & Relationships requested in `include`.
# The InfraDevice will be grouped by the Platform ansible_network_os without prefix or seperator
# Several extra variable will be compose based on the retrieved Attribute and Relationship
# We are overriting the retrieved variable `platform` to have a string instead of a dict

plugin: opsmill.infrahub.inventory
api_endpoint: "http://localhost:8000"
validate_certs: true
timeout: 30

strict: true

branch: "jfk1-update-edge-ips"

nodes:
  InfraDevice:
    filters:
      site__name__value: "jfk1"
      role__value: "edge"
    include:
      - name
      - primary_address.address
      - platform.ansible_network_os
      - interfaces

compose:
  hostname: name
  platform: platform.ansible_network_os
  ansible_host: primary_address.address | ansible.utils.ipaddr('address')

keyed_groups:
  - prefix: ""
    separator: ""
    key: platform
