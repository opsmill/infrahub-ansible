---
### infrahub_inventory.yml file in YAML format
### opsmill.infrahub.inventory plugin is able to do a lookup for ENV vars: INFRAHUB_API_TOKEN and INFRAHUB_ADDRESS

# This inventory tests hostnames fallback behavior:
# - "nonexistent" will never resolve (attribute doesn't exist), so it is skipped
# - "primary_address.address" resolves a nested relationship path as the hostname
# This verifies that the priority list skips missing paths and resolves nested dotted paths.

plugin: opsmill.infrahub.inventory
api_endpoint: "http://localhost:8000"

strict: true

hostnames:
  - nonexistent
  - primary_address.address

nodes:
  InfraDevice:
    include:
      - name
      - primary_address.address
      - site.name

compose:
  hostname: name

keyed_groups:
  - prefix: site
    key: site.name
