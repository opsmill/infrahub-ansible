---
- name: Infrahub action plugin
  gather_facts: false
  hosts: localhost

  tasks:
    - name: SET FACTS TO SEND TO GRAPHQL ENDPOINT
      ansible.builtin.set_fact:
        variables:
          device_name: "atl1-edge1"
          enabled: true

        query_dict:
          InfraInterface:
            '@filters': {enabled__value: '$enabled', device__name__value: '$device_name'}
            edges:
              node:
                id: null
                name:
                  value: null
                ... on InfraInterfaceL3:
                  ip_addresses:
                    edges:
                      node:
                        address:
                          value: null
                ... on InfraInterfaceL2:
                  tagged_vlan:
                    edges:
                      node:
                        vlan_id:
                          value: null
                        name:
                          value: null
                  untagged_vlan:
                    node:
                      vlan_id:
                          value: null
                      name:
                        value: null

    - name: Action Plugin to retrieve Interfaces of '{{variables.device_name}}'
      opsmill.infrahub.query_graphql:
        query: "{{ query_dict }}"
        graph_variables: "{{ variables }}"
        update_hostvars: true

    - name: Print InfraInterface from ansible_facts
      ansible.builtin.debug:
        msg: "{{ ansible_facts.InfraInterface }}"
