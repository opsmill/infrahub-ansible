---
- name: Create BuiltinTag examples
  gather_facts: false
  hosts: localhost

  tasks:
    # Using node mode
    - name: Should fail to create FakeKind as Schema doesn't exist
      opsmill.infrahub.create_node:
        kind: "FakeKind"
        data:
          name: "fake1"
      ignore_errors: true

    - name: Should fail to create BuiltinTag 'my-tag1' due to allow_upsert=False
      opsmill.infrahub.create_node:
        kind: "BuiltinTag"
        allow_upsert: False
        data:
          name: "my-tag1"
          description: "This is my first tag description"
      ignore_errors: true

    - name: Should fail to create BuiltinTag due to missing mandatory field 'name'
      opsmill.infrahub.create_node:
        kind: "BuiltinTag"
        data:
          description: "Tag without name"
      ignore_errors: true
