[tool.poetry]
name = "infrahub_ansible_modules"
version = "1.3.1"
description = "Ansible collection to interact with Infrahub's API"
authors = ["OpsMill <info@opsmill.com>"]
package-mode = false
license = "GPLv3"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
ansible-core = [
    { version = ">=2.15.13rc1", python = ">=3.9,<3.10" },
    { version = ">=2.17.7rc1", python = ">=3.10" },
]
ansible-lint = "*"
infrahub-sdk = {version = ">=1.5, <2.0", extras = ["all"]}
deepdiff = "*"
cryptography = ">=42.0.0"
jinja2 = ">=3.1.5"
jmespath = "*"
pyyaml = "*"
importlib-metadata = "8.5.0"
pytz = "*"
packaging = "*"
jsondiff = "*"
hypothesis = "^6.123.16"
parameterized = "^0.9.0"
bandit = "^1.8.2"

[tool.poetry.group.dev.dependencies]
codecov = "*"
invoke = "^2.2.0"
ruff = "0.9.1"
mock = "^5.1.0"
pytest = "^8.3.4"
pytest-mock = "*"
pytest-xdist = "*"
pytest-pythonpath = "*"
ansible-lint = "^25.1.2"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "tests"
]
pythonpath = ["."]

[tool.ruff]
line-length = 120

exclude = [
        ".git",
        ".tox",
        ".venv",
        "env",
        "_build",
        "build",
        "dist",
        "examples",
]

[tool.ruff.lint]
preview = true

task-tags = [
    "FIXME",
    "TODO",
    "XXX",
]

select = ["ALL"]

ignore = [
    "COM812", # missing-trailing-comma
    "CPY",    # flake8-copyright
    "D",      # pydocstyle
    "DOC",    # pydoclint
    "ISC",    # flake8-implicit-str-concat
    "FBT",    # flake8-boolean-trap

    ##################################################################################################
    # Rules below needs to be Investigated                                                           #
    ##################################################################################################
    "PT",     # flake8-pytest-style
    "PGH",    # pygrep-hooks
    "ERA",    # eradicate commented-out code
    "SLF001", # flake8-self
    "EM",     # flake8-errmsg
    "TRY",    # tryceratops
    "TD",     # flake8-todos
    "FIX",    # flake8-fixme
    "TID",    # flake8-tidy-imports
    "G",      # flake8-logging-format
    "FLY",    # flynt
    "RSE",    # flake8-raise
    "BLE",    # flake8-blind-except (BLE)
    "A",      # flake8-builtins

    ##################################################################################################
    # The ignored rules below should be removed once the code has been updated, they are included    #
    # like this so that we can reactivate them one by one. Alternatively ignored after further       #
    # investigation if they are deemed to not make sense.                                            #
    ##################################################################################################
    "B904",     # Within an `except` clause, raise exceptions with `raise ... from err` or `raise ... from None` to distinguish them from errors in exception handling
    "C408",     # Unnecessary `dict` call (rewrite as a literal)
    "E402",     # Module level import not at top of file
    "INP001",   # Is part of an implicit namespace package
    "N806",     # Variable in function should be lowercase
    "PLC0415",  # `import` should be at the top-level of a file
    "PLR0912",  # Too many branches
    "PLR6201",  # Use a `set` literal when testing for membership
    "PLR6301",  # Method could be a function, class method, or static method
    "PLR1702",  # Too many nested blocks
    "PLR0913",  # Too many arguments in function definition
    "RET504",   # Unnecessary assignment before `return` statement
]

[tool.ruff.lint.per-file-ignores]

"docs/**/*.py" = [
    "ALL"
]

"plugins/**/*.py" = [
    ##################################################################################################
    # Review and change the below later                                                              #
    ##################################################################################################
    "ANN201", # ANN201 Missing return type annotation for public function
    "ANN202", # Missing return type annotation for private function
    "ANN204", # Missing return type annotation for special method
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "F404",   # `from __future__` imports must occur at the beginning of the file
    "UP001",  # `__metaclass__ = type` is implied
    "UP010",  # Unnecessary `__future__` imports
]

"tasks/*.py" = [
    "T201",   # use of `print`
]

#https://docs.astral.sh/ruff/formatter/black/
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["infrahub"]

[tool.ruff.lint.pycodestyle]
max-line-length = 150

[tool.ruff.lint.mccabe]
# Target max-complexity=10
max-complexity = 33

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"