[project]
name = "infrahub_ansible_modules"
version = "1.8.3"
description = "Ansible collection to interact with Infrahub's API"
authors = [{name = "OpsMill", email = "info@opsmill.com"}]
license = {text = "GPLv3"}
requires-python = ">=3.11,<3.15"

dependencies = [
    "ansible-core>=2.18",
    "filelock>=3.25.2",  # CVE-2025-68146: transitive dep of tox, pinned for security
    "infrahub-sdk[all]>=1.19.0,<2.0",
    "jinja2>=3.1.6",
]

[project.optional-dependencies]
numpy = [
    "numpy>=1.24.2,<2; python_version>='3.9' and python_version<'3.12'",
    "numpy>=1.26.2,<2; python_version>='3.12' and python_version<'3.13'",
    "numpy>=2.2.6,<3; python_version>='3.13'",
]

[dependency-groups]
dev = [
    "codecov",
    "invoke>=3.0.3,<4",
    "mypy>=1.20.1,<3",
    "types-PyYAML>=6.0.12.20260408",
    "ruff==0.15.18",
    "mock>=5.2.0,<6",
    "pytest>=9.0.3,<10",
    "pytest-mock",
    "pytest-xdist",
    "pytest-pythonpath",
    "ansible-lint>=26.4.0,<27",
    "tox>=4.52.1,<5",
    "pytest-httpx>=0.30",
]
# Integration tests use testcontainers. Kept in a separate group because
# infrahub-testcontainers -> prefect-client pins cachetools<7, which conflicts
# with the dev group's tox (cachetools>=7). Install with `uv sync --group integration`.
integration = [
    "pytest>=9.0.3,<10",
    "pytest-mock",
    "infrahub-testcontainers>=1.7.3",
]

[tool.uv]
# dev and integration have incompatible transitive pins (cachetools); resolve them
# independently so each group locks on its own.
conflicts = [
    [{ group = "dev" }, { group = "integration" }],
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Disable infrahub-testcontainers' performance-test plugin: its startup hook calls
# psutil.cpu_freq(), which raises on macOS and aborts collection. Harmless when the
# plugin isn't installed (e.g. the default dev env). The container fixtures come from
# the base class, not this plugin.
addopts = ["-p", "no:pytest-infrahub-performance-test"]
testpaths = [
    "tests"
]
pythonpath = ["."]
markers = [
    "integration: requires a live Infrahub via testcontainers (needs docker); see tests/integration/processor",
]

[tool.mypy]
pretty = true
ignore_missing_imports = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
# Exclude problematic module that has complex try/except patterns
exclude = [
    "plugins/module_utils/infrahub_utils\\.py$",
    "tests/",
]

[[tool.mypy.overrides]]
module = "tasks.*"
# Invoke Collection typing is overly strict about module types
disallow_untyped_defs = false


[tool.pyright]
# Disable pyright - we use mypy for type checking
# Many errors are due to Ansible/infrahub_sdk being runtime dependencies
reportMissingImports = false
reportPossiblyUnboundVariable = false
reportRedeclaration = false
reportAttributeAccessIssue = false
reportCallIssue = false
reportReturnType = false
reportOptionalMemberAccess = false
reportArgumentType = false

[tool.ruff]
line-length = 120

exclude = [
        ".git",
        ".tox",
        ".venv",
        "env",
        "_build",
        "build",
        "dist",
        "examples",
]

[tool.ruff.lint]
preview = true

task-tags = [
    "FIXME",
    "TODO",
    "XXX",
]

select = ["ALL"]

ignore = [
    "COM812", # missing-trailing-comma
    "CPY",    # flake8-copyright
    "D",      # pydocstyle
    "DOC",    # pydoclint
    "ISC",    # flake8-implicit-str-concat
    "FBT",    # flake8-boolean-trap

    ##################################################################################################
    # Rules below needs to be Investigated                                                           #
    ##################################################################################################
    "PT",     # flake8-pytest-style
    "PGH",    # pygrep-hooks
    "ERA",    # eradicate commented-out code
    "SLF001", # flake8-self
    "EM",     # flake8-errmsg
    "TRY",    # tryceratops
    "TD",     # flake8-todos
    "FIX",    # flake8-fixme
    "TID",    # flake8-tidy-imports
    "G",      # flake8-logging-format
    "FLY",    # flynt
    "RSE",    # flake8-raise
    "BLE",    # flake8-blind-except (BLE)
    "A",      # flake8-builtins

    ##################################################################################################
    # The ignored rules below should be removed once the code has been updated, they are included    #
    # like this so that we can reactivate them one by one. Alternatively ignored after further       #
    # investigation if they are deemed to not make sense.                                            #
    ##################################################################################################
    "B904",     # Within an `except` clause, raise exceptions with `raise ... from err` or `raise ... from None` to distinguish them from errors in exception handling
    "C408",     # Unnecessary `dict` call (rewrite as a literal)
    "E402",     # Module level import not at top of file
    "INP001",   # Is part of an implicit namespace package
    "N806",     # Variable in function should be lowercase
    "PLC0415",  # `import` should be at the top-level of a file
    "PLR0912",  # Too many branches
    "PLR6201",  # Use a `set` literal when testing for membership
    "PLR6301",  # Method could be a function, class method, or static method
    "PLR1702",  # Too many nested blocks
    "PLR0913",  # Too many arguments in function definition
    "PLW0717",  # Too many statements in try clause (preview rule)
    "RET504",   # Unnecessary assignment before `return` statement
]

[tool.ruff.lint.per-file-ignores]

"docs/**/*.py" = [
    "ALL"
]

"plugins/action/object_file_fetch.py" = [
    "PLR0914", # Too many local variables — action plugin run() method
    "PLR0915", # Too many statements — action plugin run() method
]

"plugins/**/*.py" = [
    ##################################################################################################
    # Review and change the below later                                                              #
    ##################################################################################################
    "ANN001", # Missing type annotation for function argument
    "ANN201", # ANN201 Missing return type annotation for public function
    "ANN202", # Missing return type annotation for private function
    "ANN204", # Missing return type annotation for special method
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "F404",   # `from __future__` imports must occur at the beginning of the file
    "UP001",  # `__metaclass__ = type` is implied
    "UP010",  # Unnecessary `__future__` imports
]

"tests/**/*.py" = [
    "S101",    # use of `assert` (expected in tests)
    "S105",    # possible hardcoded password (test credentials)
    "S106",    # possible hardcoded password passed to argument (test credentials)
    "S108",    # /tmp paths are fine in tests
    "ANN001",  # Missing type annotation for function argument
    "ANN002",  # Missing type annotation for *args
    "ANN003",  # Missing type annotation for **kwargs
    "ANN201",  # Missing return type annotation for public function
    "ANN202",  # Missing return type annotation for private function
    "ANN204",  # Missing return type annotation for special method (e.g. __init__)
    "ARG001",  # Unused function argument (pytest fixtures)
    "ARG002",  # unused method arguments from @patch decorators
    "ARG005",  # Unused lambda argument (mock side_effects)
    "N803",    # MockProcessor-style names from @patch decorators
    "PLR0917", # too many positional args in test helpers
    "PLR2004", # Magic value used in comparison (expected counts in assertions)
    "PLC2701", # Private name import (tests intentionally probe internals)
    "INP001",  # implicit namespace package (test packages need no __init__)
    "TC002",   # move third-party import into type-checking block (not worth it in tests)
    "E402",    # module-level import not at top (intentional: after importorskip guard)
    "T201",    # use of print (intentional: integration measurement output)
    "UP001",   # `__metaclass__ = type` is implied
    "UP010",   # Unnecessary `__future__` imports
]

"tasks/*.py" = [
    "RUF067", # __init__ module re-exports (invoke task runner pattern)
    "T201",   # use of `print`
]

"conftest.py" = [
    "ANN001", # pytest hook signature is fixed
    "ARG001", # pytest hook requires `config` param even if unused
]

#https://docs.astral.sh/ruff/formatter/black/
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["infrahub"]

[tool.ruff.lint.pycodestyle]
max-line-length = 150

[tool.ruff.lint.mccabe]
# Target max-complexity=10
max-complexity = 19

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# Exclude docs from wheel - it contains node_modules and build artifacts
# Documentation should be accessed online, not bundled in the package
exclude = [
    "docs/",
    "tests/",
    ".github/",
    ".tox/",
    ".venv/",
    "*.tar.gz",
]

[tool.hatch.build.targets.sdist]
include = [
    "plugins/**/*",
    "roles/**/*",
    "meta/**/*",
    "galaxy.yml",
    "README.md",
    "LICENSE.txt",
    "CHANGELOG.rst",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
# For Ansible collections distributed as wheels, we need to include the
# collection structure (plugins, roles, meta) as data files, not Python packages.
# Using only-include ensures we get exactly what we need without bloat.
only-include = [
    "plugins",
    "roles",
    "meta",
    "galaxy.yml",
    "README.md",
    "LICENSE.txt",
    "CHANGELOG.rst",
]
